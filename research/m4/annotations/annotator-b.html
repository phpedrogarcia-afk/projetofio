const storageKey = `fio-m4-v1-${packetLabel}`;
let answers = JSON.parse(localStorage.getItem(storageKey) || "{}");
let index = Math.min(Number(localStorage.getItem(`${storageKey}-index`) || 0), rows.length - 1);
const ratings = document.getElementById("ratings");
for (let value = 0; value <= 3; value++) {
  const label = document.createElement("label"); label.className = "choice";
  label.innerHTML = `<input type="radio" name="rating" value="${value}"> ${value}`;
  ratings.appendChild(label);
}
function selectedRating() { const chosen = document.querySelector('input[name="rating"]:checked'); return chosen ? Number(chosen.value) : null; }
function completedCount() { return Object.values(answers).filter(answer => Number.isInteger(answer.rating)).length; }
function persistCurrent(requireRating) {
  const rating = selectedRating();
  if (requireRating && rating === null) { document.getElementById("status").textContent = "Escolha uma nota de 0 a 3 antes de avançar."; return false; }
  if (rating !== null) answers[rows[index].pair_id] = { rating, near_duplicate: document.getElementById("near").checked, reason_code: document.getElementById("ambiguous").checked ? "ambiguous_wording" : "" };
  localStorage.setItem(storageKey, JSON.stringify(answers)); localStorage.setItem(`${storageKey}-index`, String(index)); return true;
}
function render() {
  const row = rows[index], answer = answers[row.pair_id] || {};
  document.getElementById("anchor").textContent = row.anchor; document.getElementById("candidate").textContent = row.candidate;
  document.querySelectorAll('input[name="rating"]').forEach(input => input.checked = Number(input.value) === answer.rating);
  document.getElementById("near").checked = Boolean(answer.near_duplicate); document.getElementById("ambiguous").checked = answer.reason_code === "ambiguous_wording";
  const done = completedCount(); document.getElementById("progressText").textContent = `${done} de ${rows.length} concluídos — item ${index + 1}`;
  document.getElementById("progressBar").value = done; document.getElementById("previous").disabled = index === 0;
  document.getElementById("next").textContent = index === rows.length - 1 ? "Salvar" : "Salvar e avançar";
  document.getElementById("export").disabled = done !== rows.length; document.getElementById("status").textContent = done === rows.length ? "Pacote completo. Exporte o arquivo e mantenha-o privado." : "";
}
document.getElementById("previous").onclick = () => { persistCurrent(false); if (index > 0) index--; render(); };
document.getElementById("next").onclick = () => { if (!persistCurrent(true)) return; if (index < rows.length - 1) index++; render(); };
document.getElementById("export").onclick = () => {
  if (!persistCurrent(true) || completedCount() !== rows.length) return;
  const escape = value => `"${String(value).replaceAll('"', '""')}"`;
  const lines = ["packet_row,pair_id,anchor,candidate,rating,near_duplicate,reason_code"];
  rows.forEach((row, i) => { const answer = answers[row.pair_id]; lines.push([i + 1, row.pair_id, row.anchor, row.candidate, answer.rating, answer.near_duplicate ? "yes" : "no", answer.reason_code].map(escape).join(",")); });
  const blob = new Blob(["\ufeff" + lines.join("\r\n") + "\r\n"], {type: "text/csv;charset=utf-8"});
  const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `annotator-${packetLabel.toLowerCase()}-completed.csv`; link.click(); URL.revokeObjectURL(link.href);
};
document.getElementById("reset").onclick = () => {
  if (!confirm("Limpar todas as respostas salvas deste pacote neste navegador?")) return;

};
